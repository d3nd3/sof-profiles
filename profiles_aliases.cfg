// Console aliases: latch args into _prof_cli_* then call fn_*_entry (~args via sp_sc_func_exec).
sp_sc_alias prof_register 'set _prof_cli_slot #{1}; sp_sc_func_exec fn_register_entry'
sp_sc_alias prof_get_slot_by_id 'set _prof_cli_guid #{1}; sp_sc_func_exec fn_get_slot_by_id_entry'
sp_sc_alias prof_get_slot_by_nick 'set _prof_cli_nickname #{1}; sp_sc_func_exec fn_get_slot_by_nick_entry'
sp_sc_alias prof_admin_add 'set _prof_cli_guid #{1}; set _prof_cli_nickname #{2}; sp_sc_func_exec fn_admin_add_entry'
sp_sc_alias prof_admin_del 'set _prof_cli_guid #{1}; set _prof_cli_nickname #{2}; sp_sc_func_exec fn_admin_del_entry'
sp_sc_alias prof_apply 'set _prof_cli_slot #{1}; set _prof_cli_guid #{2}; sp_sc_func_exec fn_apply_entry'
